<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<title>SEHED Dashboard</title>

<style>

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:black;
    font-family:'Segoe UI',sans-serif;
}

/* Hela originalbilden visas */

.bg{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    object-fit:contain;
    background:black;
}

/* Tid */

.timebox{
    position:absolute;
    top:35px;
    left:35px;
    z-index:10;
}

.date{
    display:inline-block;

    padding:10px 20px;

    background:rgba(0,0,0,0.45);
    backdrop-filter:blur(10px);

    border-radius:15px;

    color:white;
    font-size:28px;
}

.time{
    color:white;
    font-size:120px;
    font-weight:700;

    text-shadow:
    0 4px 20px rgba(0,0,0,0.9);
}

/* Väder */

.weatherbox{

    position:absolute;

    top:35px;
    right:35px;

    display:flex;
    align-items:center;
    gap:20px;

    padding:12px 20px;

    background:rgba(0,0,0,0.45);
    backdrop-filter:blur(10px);

    border-radius:15px;

    z-index:10;
}

.icon{
    font-size:80px;
}

.weatherright{
    color:white;
    text-align:left;
}

.temp{
    font-size:70px;
    font-weight:700;
    line-height:1;
}

.city{
    font-size:26px;
}

</style>

</head>

<body>

<img src="Väsehed.png

<div class="timebox">

    <div id="date" class="date"></div>

    <div id="clock" class="time"></div>

</div>

<div class="weatherbox">

    <div id="weatherIcon" class="icon">
        ☀️
    </div>

    <div class="weatherright">

        <div id="temp" class="temp">
            10°
        </div>

        <div class="city">
            Gävle
        </div>

    </div>

</div>

<script>

function updateClock(){

    const d = new Date();

    document.getElementById("clock").innerHTML =
        d.toLocaleTimeString("sv-SE",
        {
            hour:"2-digit",
            minute:"2-digit"
        });

    document.getElementById("date").innerHTML =
        d.toLocaleDateString("sv-SE",
        {
            weekday:"long",
            day:"numeric",
            month:"short"
        });

}

updateClock();
setInterval(updateClock,1000);

fetch("https://api.open-meteo.com/v1/forecast?latitude=60.67&longitude=17.14&current_weather=true")
.then(r=>r.json())
.then(data=>{

    document.getElementById("temp").innerHTML =
        Math.round(data.current_weather.temperature)+"°";

    let icon="☀️";

    const code = data.current_weather.weathercode;

    if(code>=1 && code<=3) icon="⛅";
    if(code>=45) icon="🌫️";
    if(code>=51) icon="🌦️";
    if(code>=61) icon="🌧️";
    if(code>=71) icon="❄️";
    if(code>=95) icon="⛈️";

    document.getElementById("weatherIcon").innerHTML = icon;

});

</script>

</body>
</html>
