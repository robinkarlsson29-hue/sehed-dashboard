<!DOCTYPE html>
<html lang="sv">

<head>
<meta charset="utf-8">
<title>SEHED Dashboard</title>

<style>

html,
body{
margin:0;
width:100%;
height:100%;
overflow:hidden;
font-family:'Segoe UI',sans-serif;
}

body{
background-image:url('Välkomstbildsehed.png');
background-size:cover;
background-position:center center;
color:white;
}

/* Mörk toning över bilden */

body::before{
content:"";
position:absolute;
inset:0;
background:linear-gradient(
180deg,
rgba(0,0,0,0.35) 0%,
rgba(0,0,0,0.10) 40%,
rgba(0,0,0,0.20) 100%
);
}

/* Klocka */

.clock-container{
position:absolute;
top:40px;
left:50px;
z-index:10;
}

.time{
font-size:180px;
font-weight:700;
line-height:0.9;
text-shadow:0 8px 30px rgba(0,0,0,0.7);
}

.date{
font-size:42px;
font-weight:300;
margin-top:10px;
text-shadow:0 4px 20px rgba(0,0,0,0.7);
}

/* Väder */

.weather{
position:absolute;
top:55px;
right:60px;
text-align:right;
z-index:10;
}

.temp{
font-size:150px;
font-weight:700;
line-height:0.9;
text-shadow:0 8px 30px rgba(0,0,0,0.7);
}

.location{
font-size:42px;
font-weight:300;
text-shadow:0 4px 20px rgba(0,0,0,0.7);
}

/* Diskret rad längst ner */

.bottom{
position:absolute;
bottom:30px;
left:50%;
transform:translateX(-50%);
font-size:36px;
letter-spacing:3px;
font-weight:300;
text-shadow:0 4px 20px rgba(0,0,0,0.8);
z-index:10;
}

</style>
</head>

<body>

<div class="clock-container">

<div class="time" id="clock">
07:00
</div>

<div class="date" id="date">
fredag 25 september 2026
</div>

</div>

<div class="weather">

<div class="temp" id="temp">
10°
</div>

<div class="location">
Gävle
</div>

</div>

<div class="bottom">
SEHED BYGG GÄVLEBORG
</div>

<script>

function updateClock(){

const d = new Date();

document.getElementById("clock").innerHTML =
d.toLocaleTimeString("sv-SE",
{
hour:"2-digit",
minute:"2-digit"
});

document.getElementById("date").innerHTML =
d.toLocaleDateString("sv-SE",
{
weekday:"long",
year:"numeric",
month:"long",
day:"numeric"
});

}

updateClock();
setInterval(updateClock,1000);

fetch("https://api.open-meteo.com/v1/forecast?latitude=60.67&longitude=17.14&current_weather=true")
.then(r=>r.json())
.then(data=>{

document.getElementById("temp").innerHTML =
Math.round(data.current_weather.temperature)+"°";

});

</script>

</body>
</html>
