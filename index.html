<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">

<style>

html,body{
margin:0;
width:100%;
height:100%;
overflow:hidden;
}

body{

background-image:url('Välkomstbildsehed.png');

background-size:cover;

background-position:center center;

background-repeat:no-repeat;

font-family:'Segoe UI',sans-serif;

}

.clock{

position:absolute;

top:30px;
left:30px;

font-size:100px;
font-weight:700;

color:white;

text-shadow:
0 0 20px black,
0 0 40px black;

}

.weather{

position:absolute;

top:30px;
right:30px;

display:flex;
align-items:center;
gap:15px;

font-size:60px;

color:white;

text-shadow:
0 0 20px black,
0 0 40px black;

}

.weatherIcon{
font-size:70px;
}

</style>

</head>

<body>

<div class="clock" id="clock">
00:00
</div>

<div class="weather">

<div id="weatherIcon" class="weatherIcon">
☀️
</div>

<div id="temp">
10°
</div>

</div>

<script>

function updateClock(){

document.getElementById("clock").innerHTML=
new Date().toLocaleTimeString(
"sv-SE",
{
hour:"2-digit",
minute:"2-digit"
}
);

}

function updateWeather(){

fetch("https://api.open-meteo.com/v1/forecast?latitude=60.67&longitude=17.14&current_weather=true")

.then(r=>r.json())

.then(data=>{

document.getElementById("temp").innerHTML=
Math.round(data.current_weather.temperature)+"°";

const code=data.current_weather.weathercode;

let icon="☀️";

if(code>=1 && code<=3)
icon="⛅";

if(code>=45)
icon="🌫️";

if(code>=51)
icon="🌦️";

if(code>=61)
icon="🌧️";

if(code>=71)
icon="❄️";

if(code>=95)
icon="⛈️";

document.getElementById("weatherIcon").innerHTML=icon;

});

}

updateClock();
setInterval(updateClock,1000);

updateWeather();

/* uppdaterar vädret var 15:e minut */

setInterval(updateWeather,900000);

</script>

</body>

</html>
