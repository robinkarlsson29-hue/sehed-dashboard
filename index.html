<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>SEHED Dashboard</title>

<style>

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:'Segoe UI',sans-serif;
}

/* Bakgrundsbild */

.bg{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    object-fit:contain;
    z-index:1;
}

/* Klocka */

.timebox{
    position:absolute;
    top:35px;
    left:35px;
    z-index:10;
}

.date{
    display:inline-block;
    padding:10px 20px;
    border-radius:15px;
    background:rgba(0,0,0,0.45);
    color:white;
    font-size:28px;
}

.time{
    font-size:120px;
    font-weight:700;
    color:white;
    line-height:1;
    text-shadow:0 4px 20px rgba(0,0,0,0.8);
}

/* Väder */

.weatherbox{
    position:absolute;
    right:35px;
    top:35px;
    z-index:10;

    display:flex;
    align-items:center;
    gap:20px;

    padding:15px 25px;

    border-radius:15px;
    background:rgba(0,0,0,0.45);
}

.icon{
    font-size:80px;
}

.temp{
    font-size:70px;
    font-weight:700;
    color:white;
}

.city{
    font-size:24px;
    color:white;
}

</style>

</head>

<body>

<img src="Välkomstbildsehed.png" ="timebox">

    <div id="date" class="date"></div>

    <div id="clock" class="time"></div>

</div>

<div class="weatherbox">

    <div id="weatherIcon" class="icon">☀️</div>

    <div>

        <div id="temp" class="temp">10°</div>

        <div class="city">Gävle</div>

    </div>

</div>

<script>

function updateClock(){

    const d = new Date();

    document.getElementById("clock").innerHTML =
        d.toLocaleTimeString("sv-SE",{
            hour:"2-digit",
            minute:"2-digit"
        });

    document.getElementById("date").innerHTML =
        d.toLocaleDateString("sv-SE",{
            weekday:"long",
            day:"numeric",
            month:"short"
        });

}

updateClock();
setInterval(updateClock,1000);

fetch("https://api.open-meteo.com/v1/forecast?latitude=60.67&longitude=17.14&current_weather=true")
.then(r => r.json())
.then(data => {

    document.getElementById("temp").innerHTML =
        Math.round(data.current_weather.temperature) + "°";

    let icon = "☀️";

    const code = data.current_weather.weathercode;

    if(code >= 1 && code <= 3) icon = "⛅";
    if(code >= 45) icon = "🌫️";
    if(code >= 51) icon = "🌦️";
    if(code >= 61) icon = "🌧️";
    if(code >= 71) icon = "❄️";
    if(code >= 95) icon = "⛈️";

    document.getElementById("weatherIcon").innerHTML = icon;

});

</script>

</body>
</html>
