<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">

<style>

html,body{
margin:0;
width:100%;
height:100%;
overflow:hidden;
}

body{

background-image:url('Välkomstbildsehed.png');

background-size:cover;

background-position:center center;

background-repeat:no-repeat;

font-family:'Segoe UI',sans-serif;

}

.clock{

position:absolute;

top:30px;
left:30px;

font-size:100px;
font-weight:700;

color:white;

text-shadow:
0 0 20px black,
0 0 40px black;

}

.weather{

position:absolute;

top:30px;
right:30px;

font-size:60px;

color:white;

text-shadow:
0 0 20px black,
0 0 40px black;

}

</style>

</head>

<body>

<div class="clock" id="clock">
00:00
</div>

<div class="weather">
☀️ 10°
</div>

<script>

function updateClock(){

document.getElementById("clock").innerHTML=
new Date().toLocaleTimeString(
"sv-SE",
{
hour:"2-digit",
minute:"2-digit"
}
);

}

updateClock();

setInterval(updateClock,1000);

</script>

</body>

</html>
