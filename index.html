<!DOCTYPE html>
<html lang="sv">

<head>
<meta charset="utf-8">

<title>SEHED Dashboard</title>

<style>

html,body{
margin:0;
width:100%;
height:100%;
overflow:hidden;
font-family:'Segoe UI',sans-serif;
}

body{
background-image:url('Välkomstbildsehed.png');
background-size:cover;
background-position:center;
color:white;
}

/* Toning över bilden */

.overlay{
position:absolute;
inset:0;

background:linear-gradient(
180deg,
rgba(0,0,0,0.35),
rgba(0,0,0,0.05),
rgba(0,0,0,0.25)
);
}

/* Klocka */

.timebox{
position:absolute;
top:40px;
left:50px;
z-index:10;
}

.time{
font-size:180px;
font-weight:700;
line-height:0.9;

text-shadow:
0 0 20px rgba(0,0,0,0.9),
0 0 40px rgba(0,0,0,0.9);
}

.date{
font-size:42px;
font-weight:300;

text-shadow:
0 0 20px rgba(0,0,0,0.9);
}

/* Väder */

.weatherbox{
position:absolute;
top:60px;
right:60px;
z-index:10;
text-align:center;
}

.icon{
font-size:120px;
line-height:1;
}

.temp{
font-size:90px;
font-weight:700;

text-shadow:
0 0 20px rgba(0,0,0,0.9),
0 0 40px rgba(0,0,0,0.9);
}

.location{
font-size:32px;

text-shadow:
0 0 20px rgba(0,0,0,0.9);
}

/* Nederkant */

.footer{
position:absolute;
bottom:25px;
left:50%;
transform:translateX(-50%);

font-size:26px;
letter-spacing:5px;
font-weight:300;

z-index:10;

text-shadow:
0 0 20px rgba(0,0,0,0.9);
}

</style>
</head>

<body>

<div class="overlay"></div>

<div class="timebox">

<div class="date" id="date">
-
</div>

<div class="time" id="clock">
00:00
</div>

</div>

<div class="weatherbox">

<div class="icon" id="weatherIcon">
☀️
</div>

<div class="temp" id="temp">
10°
</div>

<div class="location">
Gävle
</div>

</div>

<div class="footer">
SEHED BYGG GÄVLEBORG
</div>

<script>

function updateClock(){

const d = new Date();

document.getElementById("clock").innerHTML =
d.toLocaleTimeString(
"sv-SE",
{
hour:"2-digit",
minute:"2-digit"
}
);

document.getElementById("date").innerHTML =
d.toLocaleDateString(
"sv-SE",
{
weekday:"long",
day:"numeric",
month:"long",
year:"numeric"
}
);

}

updateClock();

setInterval(updateClock,1000);

fetch("https://api.open-meteo.com/v1/forecast?latitude=60.67&longitude=17.14&current_weather=true")

.then(r=>r.json())

.then(data=>{

document.getElementById("temp").innerHTML =
Math.round(data.current_weather.temperature)+"°";

const code = data.current_weather.weathercode;

let icon="☀️";

if(code>=1 && code<=3)
icon="⛅";

if(code>=45)
icon="🌫️";

if(code>=51)
icon="🌦️";

if(code>=61)
icon="🌧️";

if(code>=71)
icon="❄️";

if(code>=95)
icon="⛈️";

document.getElementById("weatherIcon").innerHTML = icon;

});

</script>

</body>
</html>
