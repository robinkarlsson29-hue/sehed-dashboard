<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<title>SEHED Dashboard</title>

<style>
html, body {
    margin:0;
    width:100%;
    height:100%;
}

body{
    background-image:url('Välkomstbildsehed.png');
    background-size:cover;
    background-position:center;
    color:white;
    font-family:Arial,sans-serif;
}

.topbar{
    position:absolute;
    top:20px;
    left:20px;
    text-shadow:2px 2px 8px #000;
}

.weather{
    position:absolute;
    top:20px;
    right:20px;
    text-align:right;
    text-shadow:2px 2px 8px #000;
}

.clock{
    font-size:48px;
    font-weight:bold;
}

.date{
    font-size:24px;
}

.temp{
    font-size:48px;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="topbar">
    <div class="date" id="date"></div>
    <div class="clock" id="clock"></div>
</div>

<div class="weather">
    <div class="temp" id="temp">--°C</div>
    <div>Gävle</div>
</div>

<script>

function updateClock() {

    const d = new Date();

    document.getElementById("clock").innerHTML =
        d.toLocaleTimeString("sv-SE", {
            hour:"2-digit",
            minute:"2-digit"
        });

    document.getElementById("date").innerHTML =
        d.toLocaleDateString("sv-SE", {
            weekday:"long",
            year:"numeric",
            month:"long",
            day:"numeric"
        });
}

updateClock();
setInterval(updateClock,1000);

fetch("https://api.open-meteo.com/v1/forecast?latitude=60.67&longitude=17.14&current_weather=true")
.then(r => r.json())
.then(data => {
    document.getElementById("temp").innerHTML =
        Math.round(data.current_weather.temperature) + "°C";
});

</script>

</body>
</html>
