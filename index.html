<!DOCTYPE html>
<html lang="sv">

<head>
<meta charset="utf-8">
<title>SEHED Dashboard</title>

<style>

html,body{
margin:0;
width:100%;
height:100%;
overflow:hidden;
font-family:'Segoe UI',sans-serif;
}

body{
background-image:url('Välkomstbildsehed.png');
background-size:cover;
background-position:center;
color:white;
}

/* Mörk toning */

body:before{
content:"";
position:absolute;
inset:0;
background:rgba(0,0,0,0.15);
}

/* Klocka */

.timebox{
position:absolute;
top:40px;
left:40px;
z-index:20;
}

.date{
font-size:32px;
font-weight:300;

padding:10px 20px;

background:rgba(0,0,0,0.35);
backdrop-filter:blur(10px);

border-radius:15px;

display:inline-block;
}

.time{
font-size:140px;
font-weight:700;

line-height:1;

text-shadow:
0 5px 30px rgba(0,0,0,0.8);
}

/* Väder */

.weatherbox{

position:absolute;

top:40px;
right:40px;

display:flex;
align-items:center;
gap:20px;

padding:15px 25px;

background:rgba(0,0,0,0.35);
backdrop-filter:blur(10px);

border-radius:15px;

z-index:20;

}

.icon{

font-size:90px;

line-height:1;

}

.weatherright{

text-align:left;

}

.temp{

font-size:80px;
font-weight:700;
line-height:1;

}

.city{

font-size:28px;
font-weight:300;

}

/* Diskret logga nederst */

.bottom{

position:absolute;

bottom:20px;
left:50%;

transform:translateX(-50%);

font-size:24px;

letter-spacing:5px;

font-weight:300;

opacity:0.8;

text-shadow:
0 3px 15px rgba(0,0,0,0.9);

z-index:20;

}

</style>

</head>

<body>

<div class="timebox">

<div class="date" id="date"></div>

<div class="time" id="clock"></div>

</div>

<div class="weatherbox">

<div class="icon" id="weatherIcon">
☀️
</div>

<div class="weatherright">

<div class="temp" id="temp">10°</div>

<div class="city">Gävle</div>

</div>

</div>

<div class="bottom">
SEHED BYGG GÄVLEBORG
</div>

<script>

function updateClock(){

const d = new Date();

document.getElementById("clock").innerHTML =
d.toLocaleTimeString(
"sv-SE",
{
hour:"2-digit",
minute:"2-digit"
}
);

document.getElementById("date").innerHTML =
d.toLocaleDateString(
"sv-SE",
{
weekday:"long",
day:"numeric",
month:"short"
}
);

}

updateClock();
setInterval(updateClock,1000);

fetch("https://api.open-meteo.com/v1/forecast?latitude=60.67&longitude=17.14&current_weather=true")

.then(r=>r.json())

.then(data=>{

document.getElementById("temp").innerHTML =
Math.round(data.current_weather.temperature)+"°";

const code = data.current_weather.weathercode;

let icon="☀️";

if(code>=1 && code<=3)
icon="⛅";

if(code>=45)
icon="🌫️";

if(code>=51)
icon="🌦️";

if(code>=61)
icon="🌧️";

if(code>=71)
icon="❄️";

if(code>=95)
icon="⛈️";

document.getElementById("weatherIcon").innerHTML = icon;

});

</script>

</body>

</html>
